<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#342B71">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Derech Overview</title>
<style>
:root{--paper:#F7F4EC;--card:#fff;--ink:#241D4A;--soft:#6B6558;--line:#E4DFCF;--brand:#342B71;--bs:#EDEBFA;--red:#A23B32;--rb:#F7E6E3;--amb:#8A5A00;--ab:#FBEFDD;--grn:#2F6B3A;--gb:#E7F0E6;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app,#login{max-width:760px;margin:0 auto;padding:14px 14px 80px}
header{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
h1{font:400 22px var(--serif);margin:0}
.pill{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;background:var(--paper);padding:6px 0 10px;z-index:5}
.tab{flex:none;padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--soft);font-size:14px}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
.b{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.b.p{background:var(--brand);border-color:var(--brand);color:#fff}.b.red{color:var(--red)}
.c,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:12px}
.c{padding:0}.c>summary{list-style:none;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px;cursor:pointer}
.c>summary::-webkit-details-marker{display:none}
.body{padding:0 12px 12px}
.sub{font-size:12px;color:var(--soft)}.pv{font-size:13px;color:var(--soft);margin-top:3px}
.t{flex:none;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.t.needs{background:var(--rb);color:var(--red)}.t.steady{background:var(--ab);color:var(--amb)}.t.thriving{background:var(--gb);color:var(--grn)}
.tx{white-space:pre-wrap;margin:4px 0 10px}
h2{font:600 12px/1 sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:18px 2px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--bs);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;color:var(--soft)}
.stats b{display:block;font-size:22px;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0 12px}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--soft)}
.chip.on{background:var(--bs);border-color:var(--brand);color:var(--brand)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:200px;resize:vertical}
.h{border-top:1px solid var(--line);padding:6px 0;font-size:13px}.h i{color:var(--soft);font-style:normal;margin-right:6px}
.log{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}.log i{color:var(--soft);font-style:normal;margin-right:6px}
.empty{text-align:center;color:var(--soft);padding:30px 10px}
.ov{position:fixed;inset:0;background:rgba(20,16,50,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.mb{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0))}
.mb h3{margin:0 0 8px;font:400 19px var(--serif)}.mb label{display:block;font-size:12px;color:var(--soft);margin-top:10px}
.mb label>*{margin-top:4px;color:var(--ink)}.r{display:flex;gap:8px;margin-top:14px;align-items:center}.r span{flex:1}
.msg{background:var(--gb);color:var(--grn);border-radius:10px;padding:10px;margin-bottom:10px;white-space:pre-wrap;font-size:13px}
p.hint{font-size:13px;color:var(--soft);margin:6px 2px}
</style></head><body>

<div id="login" hidden>
  <h1 style="margin:40px 0 8px">Derech Overview</h1>
  <p class="hint">Enter your yeshiva code. Everyone who uses the same code sees the same overview. A new code starts a new, empty one.</p>
  <input id="code" placeholder="Yeshiva code" autocapitalize="off" autocomplete="off">
  <div class="r"><button class="b p" id="go" style="flex:1">Enter</button></div>
</div>

<div id="app" hidden>
  <header><h1>Derech Overview</h1><span><span class="pill" id="st"></span> <button class="b" id="out" style="padding:5px 10px;font-size:12px">Lock</button></span></header>
  <div class="tabs">
    <button class="tab" data-t="ov">Overview</button><button class="tab" data-t="sh">Shiurim</button><button class="tab" data-t="gu">Guys</button><button class="tab" data-t="ad">+ Add update</button>
  </div>
  <div id="view"></div>
</div>

<script>
(function(){
"use strict";
const SB={url:"https://fdzqakfwalpytzqpoitg.supabase.co",key:"sb_publishable_NblMIQhiVSdPjIHHVgxZIg_Wm8tDoOL"};
const H={apikey:SB.key,Authorization:"Bearer "+SB.key};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function ls(k,v){try{if(v===undefined){const x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const L={thriving:"Thriving",steady:"Steady",needs:"Needs attention"};
const tag=s=>s?`<span class="t ${s}">${L[s]}</span>`:"";
const blank=()=>({y:{t:"",d:""},s:{},g:{},log:[]});
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fd=d=>{try{return new Date(d+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}catch(e){return d||""}};
let code=ls("ov-code")||"",D=blank(),tab="ov",q="",filt="all",msg="";

// ---------- storage (shared Supabase row, cached on the phone) ----------
const rid=()=>"ov-"+code;
function pill(t){$("st").textContent=t}
async function load(){
  let got=false;
  try{
    const r=await fetch(`${SB.url}/rest/v1/derech_data?select=data&id=eq.${rid()}`,{headers:H});
    if(!r.ok)throw 0;const j=await r.json();
    if(j[0]&&j[0].data){D=j[0].data;got=true}
    pill("Synced");
  }catch(e){pill("Offline")}
  if(!got){const c=ls("ov-cache-"+code);if(c)D=c}
  ls("ov-cache-"+code,D);
  if(!(tab==="ad"&&$("paste")&&$("paste").value))render();
}
async function save(){
  ls("ov-cache-"+code,D);pill("Saving…");
  try{
    const r=await fetch(`${SB.url}/rest/v1/derech_data?on_conflict=id`,{method:"POST",headers:{...H,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:rid(),data:D,updated_at:new Date().toISOString()})});
    if(!r.ok)throw 0;pill("Synced");
  }catch(e){pill("Not synced – saved on this phone")}
}

// ---------- merge logic (used by paste AND manual edits) ----------
function setGuy(d,name,f,date,ch){
  const k=name.toLowerCase(),old=d.g[k];
  const g=old||(d.g[k]={name,shiur:"",room:"",st:"",t:"",d:date,h:[]});
  if(!old)ch.push(`New: ${name}${f.shiur?" ("+f.shiur+")":""}`);
  else{
    if(f.shiur&&g.shiur&&f.shiur!==g.shiur)ch.push(`${name} moved shiur: ${g.shiur} → ${f.shiur}`);
    if(f.room&&g.room&&f.room!==g.room)ch.push(`${name} changed room: ${g.room} → ${f.room}`);
    if(f.st&&g.st&&f.st!==g.st)ch.push(`${name}: ${L[g.st]} → ${L[f.st]}`);
  }
  if(f.shiur)g.shiur=f.shiur;if(f.room)g.room=f.room;if(f.st)g.st=f.st;
  if(f.body&&f.body!==g.t){g.t=f.body;g.h.unshift({d:date,t:f.body});g.h=g.h.slice(0,25)}
  g.d=date;
}
function setShiur(d,name,f,date){
  const k=name.toLowerCase(),s=d.s[k]||(d.s[k]={name,rebbi:"",st:"",t:"",d:date});
  if(f.rebbi)s.rebbi=f.rebbi;if(f.st)s.st=f.st;if(f.body)s.t=f.body;s.d=date;
}
const normSt=x=>{x=(x||"").toLowerCase().trim();if(!x)return"";if(/need|strug|concern|attent|red|worr/.test(x))return"needs";if(/thriv|great|excel|green|strong/.test(x))return"thriving";return"steady"};
function parse(txt){
  const P={y:null,s:[],g:[]};let cur=null;
  for(const raw of String(txt).split(/\r?\n/)){
    const m=raw.match(/^\s*#{1,4}\s*(yeshiva|shiur|guy|talmid)\w*\s*[:\-]?\s*(.*)$/i);
    if(m){
      const k=m[1].toLowerCase()[0],f=m[2].split("|").map(x=>x.trim());
      cur={f,b:[]};
      if(k==="y")P.y=cur;else if(k==="s")P.s.push(cur);else P.g.push(cur);
    }else if(cur)cur.b.push(raw.trimEnd());
  }
  const body=x=>x.b.join("\n").trim();
  if(P.y)P.y=body(P.y);
  P.s=P.s.filter(x=>x.f[0]).map(x=>({f:x.f,body:body(x)}));
  P.g=P.g.filter(x=>x.f[0]).map(x=>({f:x.f,body:body(x)}));
  return P;
}
function apply(P){
  const date=today(),ch=[];
  if(P.y)D.y={t:P.y,d:date};
  P.s.forEach(x=>setShiur(D,x.f[0],{rebbi:x.f[1],st:normSt(x.f[2]),body:x.body},date));
  P.g.forEach(x=>setGuy(D,x.f[0],{shiur:x.f[1],room:x.f[2],st:normSt(x.f[3]),body:x.body},date,ch));
  D.log=ch.map(t=>({d:date,t})).concat(D.log||[]).slice(0,120);
  return ch;
}

// ---------- views ----------
function counts(){const c={needs:0,steady:0,thriving:0};Object.values(D.g).forEach(g=>{if(c[g.st]!=null)c[g.st]++});return c}
const first=t=>{const l=(t||"").split("\n").find(x=>x.trim())||"";return esc(l.replace(/^[-•*]\s*/,"").slice(0,110))};
const empty=`<div class="empty">Nothing here yet.<br>Go to <b>+ Add update</b> and paste an overview.</div>`;

function rOv(){
  const c=counts(),gs=Object.values(D.g);
  if(!gs.length&&!D.y.t)return empty;
  const need=gs.filter(g=>g.st==="needs").sort((a,b)=>a.name.localeCompare(b.name));
  return `${D.y.t?`<div class="card"><div class="sub">The yeshiva overall · ${fd(D.y.d)}</div><div class="tx" style="margin-bottom:0">${fmt(D.y.t)}</div></div>`:""}
  <div class="stats"><div><b>${c.thriving}</b>Thriving</div><div><b>${c.steady}</b>Steady</div><div><b style="color:var(--red)">${c.needs}</b>Need attention</div></div>
  ${need.length?`<h2>Needs attention</h2>`+need.map(g=>`<div class="card" data-a="eg" data-k="${esc(g.name.toLowerCase())}" style="cursor:pointer"><b>${esc(g.name)}</b> <span class="sub">${esc(g.shiur||"")}</span><div class="pv">${first(g.t)}</div></div>`).join(""):""}
  ${(D.log||[]).length?`<h2>Recent changes</h2><div class="card">`+D.log.slice(0,15).map(l=>`<div class="log"><i>${fd(l.d)}</i>${esc(l.t)}</div>`).join("")+`</div>`:""}`;
}
function rSh(){
  const m={};
  Object.values(D.s).forEach(s=>m[s.name.toLowerCase()]={n:s.name,s,gs:[]});
  const none=[];
  Object.values(D.g).forEach(g=>{if(!g.shiur){none.push(g);return}const k=g.shiur.toLowerCase();(m[k]||(m[k]={n:g.shiur,s:null,gs:[]})).gs.push(g)});
  const list=Object.values(m).sort((a,b)=>a.n.localeCompare(b.n));
  if(none.length)list.push({n:"No shiur yet",s:null,gs:none,x:1});
  if(!list.length)return empty;
  return list.map(x=>{
    const s=x.s||{},n=x.gs.filter(g=>g.st==="needs").length;
    return `<details class="c"><summary><div><b>${esc(x.n)}</b><div class="sub">${esc(s.rebbi||"")}${s.rebbi?" · ":""}${x.gs.length} guys${n?` · <span style="color:var(--red)">${n} need attention</span>`:""}</div>${s.t?`<div class="pv">${first(s.t)}</div>`:""}</div>${tag(s.st)}</summary>
    <div class="body">${s.t?`<div class="tx">${fmt(s.t)}</div>`:""}
    ${x.gs.sort((a,b)=>a.name.localeCompare(b.name)).map(g=>`<div class="h" data-a="eg" data-k="${esc(g.name.toLowerCase())}" style="cursor:pointer;display:flex;justify-content:space-between;gap:8px"><span>${esc(g.name)}${g.room?` <span class="sub">Room ${esc(g.room)}</span>`:""}</span>${tag(g.st)}</div>`).join("")}
    ${x.x?"":`<button class="b" style="margin-top:10px" data-a="es" data-n="${esc(x.n)}">Edit shiur</button>`}</div></details>`}).join("");
}
function gList(){
  const gs=Object.values(D.g).filter(g=>(filt==="all"||g.st===filt)&&(!q||(g.name+" "+g.shiur+" "+g.room).toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name));
  if(!gs.length)return `<div class="empty">${Object.keys(D.g).length?"No matches.":"No guys yet. Go to <b>+ Add update</b>."}</div>`;
  return gs.map(g=>`<details class="c"><summary><div><b>${esc(g.name)}</b><div class="sub">${[g.shiur,g.room&&"Room "+g.room].filter(Boolean).map(esc).join(" · ")||"No shiur or room yet"}</div>${g.t?`<div class="pv">${first(g.t)}</div>`:""}</div>${tag(g.st)}</summary>
  <div class="body">${g.t?`<div class="tx">${fmt(g.t)}</div>`:""}
  ${g.h.slice(1,8).map(h=>`<div class="h"><i>${fd(h.d)}</i>${esc(h.t.split("\n")[0])}</div>`).join("")}
  <button class="b" style="margin-top:10px" data-a="eg" data-k="${esc(g.name.toLowerCase())}">Edit / add note</button></div></details>`).join("");
}
function rGu(){
  return `<input id="q" type="search" placeholder="Search by name, shiur or room" value="${esc(q)}">
  <div class="chips">${[["all","All"],["needs","Needs attention"],["steady","Steady"],["thriving","Thriving"]].map(([k,l])=>`<button class="chip${filt===k?" on":""}" data-a="f" data-k="${k}">${l}</button>`).join("")}</div><div id="gl">${gList()}</div>`;
}
const PROMPT=`Turn the updates below into this exact format, with no other text. One header line per item, fields separated by |. Status is thriving, steady, or needs attention. Under each header, write short bullet lines. Include every guy mentioned. Only fill in Shiur or Room if I said it (that is how I move a guy). Leave a field empty if unknown.

# YESHIVA
how the yeshiva is doing overall

# SHIUR Shiur name | Rebbi | status
how this shiur is doing

# GUY Full name | Shiur | Room | status
- how he is doing

Updates:
[paste what the Rebbi told you here]`;
function rAd(){
  const m=msg;msg="";
  return `${m?`<div class="msg">${esc(m)}</div>`:""}
  <p class="hint"><b>1.</b> Copy the prompt, give it to Claude with the Rebbi’s updates. <b>2.</b> Paste Claude’s answer here.</p>
  <button class="b" data-a="cp">Copy prompt for Claude</button>
  <h2>Paste the overview</h2>
  <textarea id="paste" placeholder="# YESHIVA&#10;...&#10;# SHIUR ...&#10;# GUY ..."></textarea>
  <p class="hint" id="pv">Paste to begin. New info is merged in; nothing else is erased.</p>
  <div class="r"><button class="b" data-a="undo">Undo last add</button><span></span><button class="b p" data-a="add">Add to app</button></div>
  <h2>Or add one note by hand</h2><button class="b" data-a="newg">+ Guy</button> <button class="b" data-a="news">+ Shiur</button>`;
}
function render(){
  $("login").hidden=!!code;$("app").hidden=!code;if(!code)return;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  $("view").innerHTML=({ov:rOv,sh:rSh,gu:rGu,ad:rAd})[tab]();
}

// ---------- edit sheets ----------
function modal(title,fields,ok,del){
  const o=document.createElement("div");o.className="ov";
  o.innerHTML=`<form class="mb"><h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.l)}${f.a?`<textarea name="${f.k}" style="min-height:90px">${esc(f.v||"")}</textarea>`:f.o?`<select name="${f.k}">${f.o.map(x=>`<option value="${x[0]}"${x[0]===f.v?" selected":""}>${x[1]}</option>`).join("")}</select>`:`<input name="${f.k}" value="${esc(f.v||"")}">`}</label>`).join("")}
  <div class="r">${del?`<button type="button" class="b red" data-x="d">Delete</button>`:""}<span></span><button type="button" class="b" data-x="c">Cancel</button><button class="b p">Save</button></div></form>`;
  document.body.appendChild(o);
  const close=()=>o.remove();
  o.onclick=e=>{if(e.target===o||e.target.dataset.x==="c")close();if(e.target.dataset.x==="d"&&confirm("Delete this permanently?")){del();close()}};
  o.querySelector("form").onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f&&ok(f);close()};
}
const STO=[["","—"],["thriving","Thriving"],["steady","Steady"],["needs","Needs attention"]];
function done(){ls("ov-cache-"+code,D);save();render()}
function editGuy(k){
  const g=D.g[k];if(!g)return;
  modal(g.name,[{k:"shiur",l:"Shiur",v:g.shiur},{k:"room",l:"Room",v:g.room},{k:"st",l:"How he’s doing",v:g.st,o:STO},{k:"body",l:"New note (replaces the current one; old ones stay in history)",a:1}],
    f=>{const ch=[];setGuy(D,g.name,{shiur:f.shiur.trim(),room:f.room.trim(),st:f.st,body:f.body.trim()},today(),ch);D.log=ch.map(t=>({d:today(),t})).concat(D.log||[]).slice(0,120);done()},
    ()=>{delete D.g[k];done()});
}
function editShiur(name){
  const s=D.s[name.toLowerCase()]||{};
  modal(name,[{k:"rebbi",l:"Rebbi",v:s.rebbi},{k:"st",l:"How the shiur is doing",v:s.st,o:STO},{k:"body",l:"Note",v:s.t,a:1}],
    f=>{setShiur(D,name,{rebbi:f.rebbi.trim(),st:f.st,body:f.body.trim()},today());done()},
    D.s[name.toLowerCase()]?()=>{delete D.s[name.toLowerCase()];done()}:null);
}

// ---------- events ----------
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t&&t.classList.contains("tab")){tab=t.dataset.t;render();return}
  const a=e.target.closest("[data-a]");if(!a)return;const k=a.dataset.k;
  switch(a.dataset.a){
    case"f":filt=k;render();break;
    case"eg":editGuy(k);break;
    case"es":editShiur(a.dataset.n);break;
    case"newg":modal("New guy",[{k:"name",l:"Full name"},{k:"shiur",l:"Shiur"},{k:"room",l:"Room"},{k:"st",l:"How he’s doing",o:STO,v:"steady"},{k:"body",l:"Note",a:1}],f=>{if(!f.name.trim())return;const ch=[];setGuy(D,f.name.trim(),{shiur:f.shiur.trim(),room:f.room.trim(),st:f.st,body:f.body.trim()},today(),ch);D.log=ch.map(t=>({d:today(),t})).concat(D.log||[]);done()});break;
    case"news":modal("New shiur",[{k:"name",l:"Shiur name"},{k:"rebbi",l:"Rebbi"},{k:"st",l:"How it’s doing",o:STO},{k:"body",l:"Note",a:1}],f=>{if(!f.name.trim())return;setShiur(D,f.name.trim(),{rebbi:f.rebbi.trim(),st:f.st,body:f.body.trim()},today());done()});break;
    case"cp":(navigator.clipboard?navigator.clipboard.writeText(PROMPT):Promise.reject()).then(()=>{a.textContent="Copied ✓"}).catch(()=>{const t=document.createElement("textarea");t.value=PROMPT;document.body.appendChild(t);t.select();try{document.execCommand("copy");a.textContent="Copied ✓"}catch(x){}t.remove()});break;
    case"add":{
      const P=parse($("paste").value),n=(P.y?1:0)+P.s.length+P.g.length;
      if(!n){$("pv").innerHTML="<span style='color:var(--red)'>Couldn’t find any # YESHIVA, # SHIUR or # GUY lines. Paste Claude’s answer exactly as given.</span>";break}
      ls("ov-prev-"+code,D);const ch=apply(P);
      msg=`Added: ${P.y?"yeshiva overview, ":""}${P.s.length} shiurim, ${P.g.length} guys.`+(ch.length?`\n\nChanges:\n`+ch.slice(0,12).map(x=>"• "+x).join("\n"):"");
      done();break}
    case"undo":{const p=ls("ov-prev-"+code);if(p&&confirm("Undo the last paste?")){D=p;msg="Undid the last add.";done()}break}
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value.toLowerCase().trim();$("gl").innerHTML=gList()}
  if(e.target.id==="paste"){const P=parse(e.target.value);$("pv").textContent=`Found: ${P.y?"overview, ":""}${P.s.length} shiurim, ${P.g.length} guys`}
});
$("go").onclick=()=>{const c=$("code").value.toLowerCase().replace(/[^a-z0-9]/g,"");if(!c)return;code=c;ls("ov-code",c);D=blank();load()};
$("code").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("out").onclick=()=>{code="";ls("ov-code","");D=blank();render()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&code&&!document.querySelector(".ov"))load()});
if(code){const c=ls("ov-cache-"+code);if(c)D=c;render();load()}else render();
})();
</script>
</body></html>
