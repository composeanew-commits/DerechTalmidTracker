<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Derech Talmid Tracker</title>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (reg) { reg.unregister(); });
    });
  }
  if ('caches' in window) {
    caches.keys().then(function (names) {
      names.forEach(function (name) { caches.delete(name); });
    });
  }
</script>
<style>
  :root{
    --paper:#F7F4EC;
    --card:#FFFFFF;
    --ink:#241D4A;
    --ink-soft:#6B6558;
    --line:#E4DFCF;
    --brand:#342B71;
    --brand-soft:#EDEBFA;
    --red:#A23B32;
    --red-bg:#F7E6E3;
    --amber:#B8791E;
    --amber-bg:#FBEFDD;
    --green:#47714B;
    --green-bg:#E7F0E6;
    --gray:#8B8779;
    --gray-bg:#EFEDE4;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1040px;margin:0 auto;padding:28px 20px 80px;}
  .hidden{display:none !important;}

  /* ---------- header ---------- */
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  .topbar h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0;color:var(--ink);}
  .topbar .sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .dot.off{background:var(--gray);}

  /* ---------- generic card / panel ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;}
  .panel + .panel{margin-top:16px;}

  label{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=password], select, textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:14px;font-family:var(--sans);color:var(--ink);background:#FEFDFB;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);}
  textarea{resize:vertical;min-height:70px;}

  button{
    font-family:var(--sans);font-size:14px;cursor:pointer;border-radius:8px;padding:9px 16px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
  }
  button:hover{border-color:var(--ink-soft);}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  button.primary:hover{background:#291F5E;}
  button.ghost{border-color:transparent;background:transparent;padding:6px 8px;color:var(--ink-soft);}
  button.ghost:hover{color:var(--ink);}
  button:disabled{opacity:.5;cursor:default;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row-end{justify-content:flex-end;}
  .err{color:var(--red);font-size:13px;margin-top:10px;}
  .hint{color:var(--ink-soft);font-size:12px;margin-top:6px;line-height:1.5;}

  /* ---------- setup / mapping ---------- */
  .setup-title{font-family:var(--serif);font-size:22px;margin:0 0 4px;}
  .setup-desc{font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.6;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
  @media (max-width:640px){.field-grid{grid-template-columns:1fr;}}

  .sample-box{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--ink-soft);margin-top:16px;max-height:160px;overflow:auto;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;}

  .threshold-row{display:flex;align-items:center;gap:10px;margin-top:6px;}
  input[type=range]{flex:1;}
  .threshold-val{font-size:12px;color:var(--ink-soft);min-width:34px;text-align:right;}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .toolbar input[type=text]{max-width:240px;}
  .toolbar select{max-width:180px;}
  .spacer{flex:1;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .summary{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  .summary b{color:var(--ink);font-weight:500;}

  /* ---------- grid of students ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;
    text-align:center;cursor:pointer;transition:border-color .12s ease,transform .12s ease;
    position:relative;
  }
  .card:hover{border-color:var(--ink-soft);transform:translateY(-1px);}
  .photo{
    width:72px;height:72px;border-radius:50%;margin:0 auto 10px;object-fit:cover;
    background:var(--brand-soft);display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:22px;color:var(--brand);
    border:3px solid var(--card);box-shadow:0 0 0 3px var(--ring,var(--gray));
  }
  .photo.red{--ring:var(--red);}
  .photo.yellow{--ring:var(--amber);}
  .photo.green{--ring:var(--green);}
  .name{font-family:var(--serif);font-size:15px;color:var(--ink);margin-bottom:4px;}
  .status-label{font-size:11px;text-transform:none;padding:2px 9px;border-radius:999px;display:inline-block;}
  .status-label.red{background:var(--red-bg);color:var(--red);}
  .status-label.yellow{background:var(--amber-bg);color:var(--amber);}
  .status-label.green{background:var(--green-bg);color:var(--green);}
  .status-label.unknown{background:var(--gray-bg);color:var(--gray);}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}

  /* ---------- drawer ---------- */
  .overlay{position:fixed;inset:0;background:rgba(36,29,74,.35);display:flex;justify-content:flex-end;z-index:50;}
  .drawer{width:min(420px,92vw);height:100%;background:var(--card);padding:26px 24px;overflow-y:auto;box-shadow:-8px 0 24px rgba(0,0,0,.08);}
  .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .drawer .photo{width:86px;height:86px;font-size:26px;margin:0 0 14px;}
  .drawer .name{font-size:20px;text-align:left;margin-bottom:6px;}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .kv .k{color:var(--ink-soft);}
  .kv .v{color:var(--ink);text-align:right;max-width:60%;word-break:break-word;}
  .status-buttons{display:flex;gap:8px;margin-top:6px;}
  .status-buttons button{flex:1;padding:8px 0;font-size:12px;}
  .status-buttons button.on-red{border-color:var(--red);color:var(--red);}
  .status-buttons button.on-yellow{border-color:var(--amber);color:var(--amber);}
  .status-buttons button.on-green{border-color:var(--green);color:var(--green);}
  .status-buttons button.active{color:#fff;}
  .status-buttons button.active.on-red{background:var(--red);}
  .status-buttons button.active.on-yellow{background:var(--amber);}
  .status-buttons button.active.on-green{background:var(--green);}

  details{margin-top:20px;}
  summary{cursor:pointer;font-size:12px;color:var(--ink-soft);}
  pre{font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:260px;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div>
      <h1>Derech Talmid Tracker</h1>
      <div class="sub" id="subtitle">Connect to see how everyone's doing.</div>
    </div>
    <div class="pill" id="connPill"><span class="dot off"></span><span id="connText">not connected</span></div>
  </div>

  <!-- SETUP VIEW -->
  <div id="setupView" class="panel">
    <p class="setup-title">Connect your data</p>
    <p class="setup-desc">This uses the same Supabase project the tracker app already saves to, so it's your real, live student list.</p>
    <label for="sbUrl">Supabase URL</label>
    <input type="text" id="sbUrl" placeholder="https://xxxxx.supabase.co" />
    <label for="sbKey">Supabase anon / publishable key</label>
    <input type="password" id="sbKey" placeholder="eyJ... or sb_publishable_..." />
    <label for="sbBucket">Photo storage bucket <span style="color:var(--ink-soft);font-weight:400;">(optional, for uploading photos)</span></label>
    <input type="text" id="sbBucket" placeholder="student-photos" value="student-photos" />
    <div class="row" style="margin-top:18px;">
      <button class="primary" id="connectBtn">Connect</button>
      <span id="setupErr" class="err hidden"></span>
    </div>
    <p class="hint" id="setupHint"></p>
  </div>

  <!-- MAPPING VIEW -->
  <div id="mappingView" class="panel hidden">
    <p class="setup-title">Set up the view</p>
    <p class="setup-desc" id="mappingDesc"></p>

    <div class="field-grid">
      <div>
        <label for="mapName">Name field</label>
        <select id="mapName"></select>

        <label for="mapPhoto">Photo field <span style="color:var(--ink-soft);font-weight:400;">(optional)</span></label>
        <select id="mapPhoto"></select>
      </div>
      <div>
        <label for="mapMode">How is attention level tracked?</label>
        <select id="mapMode">
          <option value="status">A status / category field (e.g. red, yellow, green)</option>
          <option value="score">A number (e.g. a score, rating, or count)</option>
          <option value="none">Nothing yet &mdash; I'll set it from here</option>
        </select>

        <div id="statusFieldWrap">
          <label for="mapStatus">Status field</label>
          <select id="mapStatus"></select>
        </div>

        <div id="scoreFieldWrap" class="hidden">
          <label for="mapScore">Number field</label>
          <select id="mapScore"></select>
          <label>Higher number means</label>
          <select id="mapDirection">
            <option value="worse">more attention needed</option>
            <option value="better">doing better</option>
          </select>
        </div>
      </div>
    </div>

    <label for="mapNotes">Notes field <span style="color:var(--ink-soft);font-weight:400;">(optional, shown in detail view)</span></label>
    <select id="mapNotes"></select>

    <div class="sample-box" id="sampleBox"></div>

    <div class="row row-end" style="margin-top:18px;">
      <button id="mappingCancel" class="ghost">Start over</button>
      <button id="mappingSave" class="primary">Show my students</button>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashView" class="hidden">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search students" />
      <select id="sortSelect">
        <option value="attention">Sort: needs attention first</option>
        <option value="name">Sort: name</option>
      </select>
      <div class="spacer"></div>
      <div class="legend">
        <span><i style="background:var(--red)"></i>Needs attention</span>
        <span><i style="background:var(--amber)"></i>Keep an eye on</span>
        <span><i style="background:var(--green)"></i>Doing great</span>
      </div>
      <button class="ghost" id="editMapping" title="Change how status is calculated">Edit view</button>
      <button class="ghost" id="refreshBtn" title="Refresh from Supabase">Refresh</button>
    </div>
    <div class="summary" id="summaryLine"></div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="emptyState">No students match your search.</div>
  </div>

</div>

<script>
(function(){
  "use strict";

  const state = {
    config: null,
    rootData: null,
    updatedAt: null,
    arrPath: null,
    students: null,
    mapping: null,
    filterText: "",
    sortMode: "attention"
  };

  const $ = id => document.getElementById(id);

  // ---------------- storage helpers ----------------
  async function loadSaved(key){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  async function saveState(key, value){
    try{ await window.storage.set(key, JSON.stringify(value), false); }catch(e){}
  }

  // ---------------- supabase fetch ----------------
  async function sbGet(path){
    const res = await fetch(`${state.config.url}/rest/v1/${path}`, {
      headers:{
        apikey: state.config.key,
        Authorization: `Bearer ${state.config.key}`
      }
    });
    if(!res.ok){
      const text = await res.text().catch(()=> "");
      throw new Error(`${res.status} ${res.statusText} ${text}`.trim());
    }
    return res.json();
  }

  async function sbUpsert(dataBlob){
    const res = await fetch(`${state.config.url}/rest/v1/derech_data?on_conflict=id`, {
      method:"POST",
      headers:{
        apikey: state.config.key,
        Authorization: `Bearer ${state.config.key}`,
        "Content-Type":"application/json",
        "Prefer":"resolution=merge-duplicates"
      },
      body: JSON.stringify({ id:"main", data: dataBlob, updated_at: new Date().toISOString() })
    });
    if(!res.ok){
      const text = await res.text().catch(()=> "");
      throw new Error(`${res.status} ${res.statusText} ${text}`.trim());
    }
  }

  async function sbUploadPhoto(file){
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = `${Date.now()}-${safeName}`;
    const bucket = state.config.bucket || "student-photos";
    const res = await fetch(`${state.config.url}/storage/v1/object/${bucket}/${path}`, {
      method: "POST",
      headers:{
        apikey: state.config.key,
        Authorization: `Bearer ${state.config.key}`,
        "Content-Type": file.type || "application/octet-stream",
        "x-upsert": "true"
      },
      body: file
    });
    if(!res.ok){
      const text = await res.text().catch(()=> "");
      throw new Error(`${res.status} ${res.statusText} ${text}`.trim());
    }
    return `${state.config.url}/storage/v1/object/public/${bucket}/${path}`;
  }

  function setConn(on, label){
    $("connText").textContent = label;
    $("connPill").querySelector(".dot").classList.toggle("off", !on);
  }

  // ---------------- data shape detection ----------------
  function scoreArray(arr){
    if(!Array.isArray(arr) || arr.length === 0) return -1;
    let objCount = 0, nameHits = 0;
    for(const item of arr){
      if(item && typeof item === "object" && !Array.isArray(item)){
        objCount++;
        if(Object.keys(item).some(k => /name/i.test(k))) nameHits++;
      }
    }
    if(objCount === 0) return -1;
    return objCount + nameHits * 5;
  }

  function findArrays(obj, path, results){
    if(Array.isArray(obj)){
      results.push({ path, arr: obj, score: scoreArray(obj) });
    } else if(obj && typeof obj === "object"){
      for(const k of Object.keys(obj)){
        findArrays(obj[k], path ? `${path}.${k}` : k, results);
      }
    }
    return results;
  }

  function getByPath(root, path){
    if(!path) return root;
    return path.split(".").reduce((o,k)=> (o==null? undefined : o[k]), root);
  }

  function collectFields(arr){
    const fields = {};
    arr.slice(0,25).forEach(item=>{
      if(!item || typeof item !== "object") return;
      Object.keys(item).forEach(k=>{
        if(!fields[k]) fields[k] = { samples: [], numeric:true, urlLike:true };
        const v = item[k];
        if(fields[k].samples.length < 3 && v !== undefined && v !== null && v !== "") fields[k].samples.push(v);
        if(typeof v !== "number") fields[k].numeric = false;
        if(!(typeof v === "string" && /^(https?:|data:)/.test(v))) fields[k].urlLike = false;
      });
    });
    return fields;
  }

  function guessField(fields, regex){
    return Object.keys(fields).find(k => regex.test(k)) || "";
  }

  // ---------------- boot ----------------
  async function boot(){
    const savedConfig = await loadSaved("sb-config");
    const savedMapping = await loadSaved("field-mapping");
    if(savedConfig){
      $("sbUrl").value = savedConfig.url;
      $("sbKey").value = savedConfig.key;
      $("sbBucket").value = savedConfig.bucket || "student-photos";
    }
    if(savedConfig){
      try{
        await connect(savedConfig, true);
        if(savedMapping && savedMapping.arrPath && pathStillValid(savedMapping)){
          state.mapping = savedMapping;
          applyMappingAndShowDashboard();
          return;
        }
        openMappingView();
      }catch(e){
        showSetup();
        showSetupError(e.message);
      }
    }
  }

  function pathStillValid(mapping){
    const arr = getByPath(state.rootData, mapping.arrPath);
    return Array.isArray(arr);
  }

  function showSetup(){
    $("setupView").classList.remove("hidden");
    $("mappingView").classList.add("hidden");
    $("dashView").classList.add("hidden");
  }
  function showSetupError(msg){
    const el = $("setupErr");
    el.textContent = "Couldn't connect \u2014 " + msg;
    el.classList.remove("hidden");
  }

  async function connect(cfg, silent){
    state.config = cfg;
    setConn(false, "connecting\u2026");
    const rows = await sbGet("derech_data?select=data,updated_at&id=eq.main");
    if(!rows || !rows.length){
      throw new Error("Connected, but no data row found yet in derech_data.");
    }
    state.rootData = rows[0].data;
    state.updatedAt = rows[0].updated_at;
    setConn(true, "connected");
    $("subtitle").textContent = "Last saved " + new Date(state.updatedAt).toLocaleString();
    await saveState("sb-config", cfg);
    if(!silent) $("setupErr").classList.add("hidden");
  }

  $("connectBtn").addEventListener("click", async ()=>{
    const url = $("sbUrl").value.trim().replace(/\/$/,"");
    const key = $("sbKey").value.trim();
    const bucket = $("sbBucket").value.trim() || "student-photos";
    $("setupErr").classList.add("hidden");
    if(!url || !key){
      showSetupError("enter both the URL and the key.");
      return;
    }
    $("connectBtn").disabled = true;
    try{
      await connect({ url, key, bucket });
      openMappingView();
    }catch(e){
      showSetupError(e.message);
    }finally{
      $("connectBtn").disabled = false;
    }
  });

  // ---------------- mapping view ----------------
  function openMappingView(){
    const candidates = findArrays(state.rootData, "", []).filter(c=>c.score > 0).sort((a,b)=>b.score-a.score);
    if(!candidates.length){
      $("mappingDesc").innerHTML = "I connected, but couldn't find a list of students in your data automatically.";
      $("sampleBox").textContent = JSON.stringify(state.rootData, null, 2).slice(0,4000);
      $("setupView").classList.add("hidden");
      $("mappingView").classList.remove("hidden");
      $("dashView").classList.add("hidden");
      $("mapName").innerHTML = "";
      $("mapPhoto").innerHTML = "";
      $("mapStatus").innerHTML = "";
      $("mapScore").innerHTML = "";
      $("mapNotes").innerHTML = "";
      $("mappingSave").disabled = true;
      return;
    }
    $("mappingSave").disabled = false;
    const best = candidates[0];
    state.arrPath = best.path;
    const fields = collectFields(best.arr);
    const keys = Object.keys(fields);

    $("mappingDesc").textContent = `Found ${best.arr.length} record${best.arr.length===1?"":"s"} at "${best.path || "(root array)"}". Tell me which field is which, and I'll remember it.`;

    function fillSelect(el, extraFirst){
      el.innerHTML = "";
      if(extraFirst){
        const o = document.createElement("option");
        o.value = ""; o.textContent = extraFirst;
        el.appendChild(o);
      }
      keys.forEach(k=>{
        const o = document.createElement("option");
        o.value = k;
        const s = fields[k].samples[0];
        o.textContent = s !== undefined ? `${k}  (e.g. "${String(s).slice(0,28)}")` : k;
        el.appendChild(o);
      });
    }
    fillSelect($("mapName"));
    fillSelect($("mapPhoto"), "None");
    fillSelect($("mapStatus"), "None");
    fillSelect($("mapScore"), "None");
    fillSelect($("mapNotes"), "None");

    $("mapName").value = guessField(fields, /^(name|fullname|studentname|talmid.*name)$/i) || guessField(fields, /name/i) || keys[0];
    const photoGuess = keys.find(k => /photo|avatar|image|pic/i.test(k) && fields[k].urlLike) || guessField(fields, /photo|avatar|image|pic/i);
    $("mapPhoto").value = photoGuess || "";
    const statusGuess = guessField(fields, /status|level|flag|color|attention/i);
    const scoreGuess = keys.find(k => fields[k].numeric && !/id|phone|grade\b/i.test(k) && !/name/i.test(k));
    $("mapStatus").value = statusGuess || "";
    $("mapScore").value = scoreGuess || "";
    $("mapMode").value = statusGuess ? "status" : (scoreGuess ? "score" : "none");
    $("mapNotes").value = guessField(fields, /note|comment|remark/i) || "";
    $("mapDirection").value = /absen|issue|risk|concern|problem|miss/i.test(scoreGuess||"") ? "worse" : "better";

    toggleModeFields();
    renderSample(best.arr);

    $("setupView").classList.add("hidden");
    $("mappingView").classList.remove("hidden");
    $("dashView").classList.add("hidden");
  }

  function renderSample(arr){
    const sample = arr.slice(0,2);
    $("sampleBox").textContent = JSON.stringify(sample, null, 2).slice(0,3000);
  }

  function toggleModeFields(){
    const mode = $("mapMode").value;
    $("statusFieldWrap").classList.toggle("hidden", mode !== "status");
    $("scoreFieldWrap").classList.toggle("hidden", mode !== "score");
  }
  $("mapMode").addEventListener("change", toggleModeFields);

  $("mappingCancel").addEventListener("click", ()=>{
    state.config = null;
    setConn(false, "not connected");
    showSetup();
  });

  $("mappingSave").addEventListener("click", async ()=>{
    const mode = $("mapMode").value;
    const mapping = {
      arrPath: state.arrPath,
      nameField: $("mapName").value,
      photoField: $("mapPhoto").value,
      mode,
      statusField: mode === "status" ? $("mapStatus").value : "",
      scoreField: mode === "score" ? $("mapScore").value : "",
      scoreDirection: $("mapDirection").value,
      notesField: $("mapNotes").value,
      redMax: null,
      yellowMax: null
    };
    if(mode === "score"){
      const arr = getByPath(state.rootData, state.arrPath);
      const nums = arr.map(it => Number(it[mapping.scoreField])).filter(n => !isNaN(n));
      const min = Math.min(...nums), max = Math.max(...nums);
      const span = (max - min) || 1;
      mapping.redMax = min + span * (mapping.scoreDirection === "worse" ? 0.33 : 0.0) ;
      mapping.yellowMax = min + span * (mapping.scoreDirection === "worse" ? 0.66 : 0.33);
      if(mapping.scoreDirection === "better"){
        mapping.redMax = min + span * 0.33;
        mapping.yellowMax = min + span * 0.66;
      }
    }
    state.mapping = mapping;
    await saveState("field-mapping", mapping);
    applyMappingAndShowDashboard();
  });

  $("editMapping").addEventListener("click", openMappingView);

  // ---------------- status computation ----------------
  function computeStatus(item, mapping){
    if(mapping.mode === "status" && mapping.statusField){
      const v = String(item[mapping.statusField] || "").toLowerCase();
      if(/red|critical|danger|low|poor|struggl|behind/.test(v)) return "red";
      if(/yellow|amber|warn|medium|fair|ok\b/.test(v)) return "yellow";
      if(/green|good|high|great|excellent|strong/.test(v)) return "green";
      return "unknown";
    }
    if(mapping.mode === "score" && mapping.scoreField){
      const n = Number(item[mapping.scoreField]);
      if(isNaN(n)) return "unknown";
      if(mapping.scoreDirection === "worse"){
        if(n <= mapping.redMax) return "red";
        if(n <= mapping.yellowMax) return "yellow";
        return "green";
      }else{
        if(n <= mapping.redMax) return "red";
        if(n <= mapping.yellowMax) return "yellow";
        return "green";
      }
    }
    if(item.__manualStatus) return item.__manualStatus;
    return "unknown";
  }

  const STATUS_LABEL = { red:"Needs attention", yellow:"Keep an eye on", green:"Doing great", unknown:"No status yet" };
  const STATUS_ORDER = { red:0, yellow:1, unknown:2, green:3 };

  function initials(name){
    return (name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
  }

  // ---------------- dashboard ----------------
  function applyMappingAndShowDashboard(){
    $("setupView").classList.add("hidden");
    $("mappingView").classList.add("hidden");
    $("dashView").classList.remove("hidden");
    renderDashboard();
  }

  function currentArr(){
    return getByPath(state.rootData, state.mapping.arrPath) || [];
  }

  function renderDashboard(){
    const mapping = state.mapping;
    const arr = currentArr();
    const filterText = state.filterText.toLowerCase();

    let items = arr.map((item, idx) => ({
      item, idx, status: computeStatus(item, mapping)
    }));

    if(filterText){
      items = items.filter(({item}) => String(item[mapping.nameField]||"").toLowerCase().includes(filterText));
    }

    if(state.sortMode === "attention"){
      items.sort((a,b) => STATUS_ORDER[a.status]-STATUS_ORDER[b.status] || String(a.item[mapping.nameField]||"").localeCompare(String(b.item[mapping.nameField]||"")));
    }else{
      items.sort((a,b) => String(a.item[mapping.nameField]||"").localeCompare(String(b.item[mapping.nameField]||"")));
    }

    const counts = { red:0, yellow:0, green:0, unknown:0 };
    arr.forEach(item => counts[computeStatus(item, mapping)]++);
    $("summaryLine").innerHTML = `<b>${arr.length}</b> student${arr.length===1?"":"s"} &nbsp;&middot;&nbsp; <b>${counts.red}</b> need attention &nbsp;&middot;&nbsp; <b>${counts.yellow}</b> keep an eye on &nbsp;&middot;&nbsp; <b>${counts.green}</b> doing great`;

    const grid = $("grid");
    grid.innerHTML = "";
    $("emptyState").classList.toggle("hidden", items.length !== 0);

    items.forEach(({item, idx, status}) => {
      const name = item[mapping.nameField] || "Unnamed";
      const photoUrl = mapping.photoField ? item[mapping.photoField] : "";
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="photo ${status}">${photoUrl ? "" : initials(name)}</div>
        <div class="name">${escapeHtml(name)}</div>
        <span class="status-label ${status}">${STATUS_LABEL[status]}</span>
      `;
      if(photoUrl){
        const img = document.createElement("img");
        img.src = photoUrl;
        img.alt = name;
        img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:50%;";
        img.onerror = ()=>{ img.remove(); card.querySelector(".photo").textContent = initials(name); };
        card.querySelector(".photo").appendChild(img);
      }
      card.addEventListener("click", ()=> openDrawer(idx));
      grid.appendChild(card);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  $("search").addEventListener("input", e => { state.filterText = e.target.value; renderDashboard(); });
  $("sortSelect").addEventListener("change", e => { state.sortMode = e.target.value; renderDashboard(); });
  $("refreshBtn").addEventListener("click", async ()=>{
    try{
      await connect(state.config, true);
      renderDashboard();
    }catch(e){ alert("Couldn't refresh: " + e.message); }
  });

  // ---------------- drawer ----------------
  function openDrawer(idx){
    const mapping = state.mapping;
    const arr = currentArr();
    const item = arr[idx];
    const name = item[mapping.nameField] || "Unnamed";
    const photoUrl = mapping.photoField ? item[mapping.photoField] : "";
    const status = computeStatus(item, mapping);

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.addEventListener("click", e => { if(e.target === overlay) overlay.remove(); });

    const otherRows = Object.keys(item)
      .filter(k => k !== mapping.nameField && k !== mapping.photoField && k !== mapping.statusField && k !== "__manualStatus")
      .map(k => `<div class="kv"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(String(item[k]))}</span></div>`)
      .join("");

    const showStatusButtons = mapping.mode !== "score";

    overlay.innerHTML = `
      <div class="drawer">
        <div class="drawer-head">
          <div>
            <div class="photo ${status}">${photoUrl ? "" : initials(name)}</div>
            <div class="name">${escapeHtml(name)}</div>
          </div>
          <button class="ghost" id="closeDrawer">Close</button>
        </div>
        <label>Photo</label>
        <div class="row">
          <input type="file" id="photoInput" accept="image/*" style="flex:1;min-width:0;" />
          <button id="uploadPhotoBtn">Upload</button>
        </div>
        <span id="uploadMsg" class="hint"></span>
        ${showStatusButtons ? `
        <label>Attention status</label>
        <div class="status-buttons">
          <button data-s="red" class="on-red ${status==='red'?'active':''}">Red</button>
          <button data-s="yellow" class="on-yellow ${status==='yellow'?'active':''}">Yellow</button>
          <button data-s="green" class="on-green ${status==='green'?'active':''}">Green</button>
        </div>` : ""}
        ${mapping.notesField ? `
        <label>${escapeHtml(mapping.notesField)}</label>
        <textarea id="notesBox">${escapeHtml(item[mapping.notesField] || "")}</textarea>
        <div class="row row-end" style="margin-top:10px;">
          <button class="primary" id="saveNotes">Save</button>
          <span id="saveMsg" class="hint"></span>
        </div>` : ""}
        <details ${mapping.notesField ? "" : "open"}>
          <summary>All fields</summary>
          ${otherRows || '<p class="hint">No other fields.</p>'}
        </details>
      </div>
    `;
    if(photoUrl){
      const img = document.createElement("img");
      img.src = photoUrl; img.alt = name;
      img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:50%;";
      img.onerror = ()=> img.remove();
      overlay.querySelector(".photo").appendChild(img);
    }
    document.body.appendChild(overlay);
    overlay.querySelector("#closeDrawer").addEventListener("click", ()=> overlay.remove());

    overlay.querySelector("#uploadPhotoBtn").addEventListener("click", async ()=>{
      const fileInput = overlay.querySelector("#photoInput");
      const uploadMsg = overlay.querySelector("#uploadMsg");
      const file = fileInput.files && fileInput.files[0];
      if(!file){
        uploadMsg.textContent = "Choose a photo first.";
        uploadMsg.style.color = "var(--red)";
        return;
      }
      const btn = overlay.querySelector("#uploadPhotoBtn");
      btn.disabled = true;
      uploadMsg.style.color = "var(--ink-soft)";
      uploadMsg.textContent = "Uploading\u2026";
      try{
        const publicUrl = await sbUploadPhoto(file);
        if(!mapping.photoField){
          mapping.photoField = "photoUrl";
          await saveState("field-mapping", mapping);
        }
        item[mapping.photoField] = publicUrl;
        await persist();
        uploadMsg.textContent = "Photo saved.";
        overlay.remove();
        renderDashboard();
      }catch(e){
        uploadMsg.style.color = "var(--red)";
        uploadMsg.textContent = "Couldn't upload \u2014 " + e.message;
      }finally{
        btn.disabled = false;
      }
    });

    if(showStatusButtons){
      overlay.querySelectorAll(".status-buttons button").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const newStatus = btn.dataset.s;
          if(mapping.mode === "status" && mapping.statusField){
            item[mapping.statusField] = newStatus;
          }else{
            item.__manualStatus = newStatus;
          }
          await persist();
          overlay.remove();
          renderDashboard();
        });
      });
    }

    const saveBtn = overlay.querySelector("#saveNotes");
    if(saveBtn){
      saveBtn.addEventListener("click", async ()=>{
        item[mapping.notesField] = overlay.querySelector("#notesBox").value;
        saveBtn.disabled = true;
        try{
          await persist();
          overlay.querySelector("#saveMsg").textContent = "Saved.";
        }catch(e){
          overlay.querySelector("#saveMsg").textContent = "Couldn't save: " + e.message;
        }finally{
          saveBtn.disabled = false;
        }
      });
    }
  }

  async function persist(){
    await sbUpsert(state.rootData);
    state.updatedAt = new Date().toISOString();
    $("subtitle").textContent = "Last saved " + new Date(state.updatedAt).toLocaleString();
  }

  boot();
})();
</script>
</body>
</html>
